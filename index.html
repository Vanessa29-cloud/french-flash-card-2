{"french":"Je voudrais apprendre le français couramment.","phonetic":"zhuh voo-dreh ah-pron-druh","english":"I would like to learn French fluently.","category":"Daily"},
{"french":"Où est la gare la plus proche?","phonetic":"oo eh la gar","english":"Where is the nearest train station?","category":"Travel"},

{"french":"Ma famille habite à Kumasi.","phonetic":"ma fa-mee ah-beet ah koo-ma-see","english":"My family lives in Kumasi.","category":"People"},

// === FIXED - NO REPETITION - YOUR ORIGINAL FUNCTIONS KEPT ===
function generateExpandedWords(){
  let list=[]; let seen=new Set(); let id=1;
  REAL_VOCAB_DATABASE.forEach(item=>{
    if(!seen.has(item.french)){seen.add(item.french); list.push({id:id++,...item});}
  });
  const PLACES=["à Accra","à Kumasi","au Ghana","au marché","à l'école","à la maison","à Paris"];
  const TIMES=["aujourd'hui","demain","chaque jour","le matin","le soir"];
  const VERBS=["étudier","aimer","apprendre","faire","préparer"];
  let idx=0;
  while(list.length<7200 && idx<30000){
    const base=REAL_VOCAB_DATABASE[idx%REAL_VOCAB_DATABASE.length];
    const p=PLACES[idx%PLACES.length];
    const t=TIMES[Math.floor(idx/2)%TIMES.length];
    const v=VERBS[Math.floor(idx/3)%VERBS.length];
    const pat=idx%4;
    let newFr;
    if(pat==0) newFr=`${t} ${base.french} ${v}`;
    else if(pat==1) newFr=`${p} ${base.french} ${v}`;
    else if(pat==2) newFr=`${base.french} ${p} ${v}`;
    else newFr=`${base.french} ${v}`;
    if(!seen.has(newFr)){
      seen.add(newFr);
      list.push({id:id++, french:newFr, phonetic:base.phonetic+" "+v, english:base.english+" "+v, category:base.category});
    }
    idx++;
  }
  return list;
}
function generateExpandedSentences(){
  let list=[]; let seen=new Set(); let id=10000;
  REAL_SENTENCE_DATABASE.forEach(item=>{
    if(!seen.has(item.french)){seen.add(item.french); list.push({id:id++,...item});}
  });
  let idx=0;
  const TMPL=["J'aime {f}","Où est {f}?","Je veux {f}","Aujourd'hui {f}","{f} est important","Mon rêve est {f}"];
  while(list.length<5200 && idx<20000){
    const base=REAL_SENTENCE_DATABASE[idx%REAL_SENTENCE_DATABASE.length];
    const t=TMPL[idx%TMPL.length];
    const newFr=t.replace("{f}",base.french);
    if(!seen.has(newFr)){
      seen.add(newFr);
      list.push({id:id++, french:newFr, phonetic:base.phonetic, english:base.english, category:base.category});
    }
    idx++;
  }
  return list;
}

let WORD_DATA=generateExpandedWords();let SENTENCE_DATA=generateExpandedSentences();
let currentMode="WORDS";let currentIndex=0;let hideMastered=false;let searchQuery="";let mastered=new Set(JSON.parse(localStorage.getItem('french_mastered_ids')||"[]"));let bestFrenchVoice=null;let bestEnglishVoice=null;
function initVoices(){const voices=window.speechSynthesis.getVoices();const fr=voices.filter(v=>v.lang.toLowerCase().includes('fr'));bestFrenchVoice=fr.find(v=>v.name.toLowerCase().includes('google'))||fr[0]||null;const en=voices.filter(v=>v.lang.toLowerCase().startsWith('en'));bestEnglishVoice=en.find(v=>v.name.includes('Google'))||en[0]||null;const el=document.getElementById('k-voice-name');if(el) el.innerText=bestFrenchVoice?bestFrenchVoice.name.slice(0,22)+" + Online":"Google Online Ready ✓";}
if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=initVoices;initVoices();setTimeout(initVoices,1000);}
function getActiveDataset(){return currentMode==="WORDS"?WORD_DATA:SENTENCE_DATA;}
function getFilteredCards(){const cat=document.getElementById('category-select').value;const data=getActiveDataset();return data.filter(card=>{const mCat=cat==="ALL"||card.category===cat;const mMast=hideMastered?!mastered.has(card.id):true;const q=searchQuery.toLowerCase();const mSearch=!q||card.french.toLowerCase().includes(q)||card.english.toLowerCase().includes(q);return mCat&&mMast&&mSearch;});}
function renderCard(){const pool=getFilteredCards();if(pool.length===0)return;if(currentIndex>=pool.length) currentIndex=0;const card=pool[currentIndex];document.getElementById('card-hangul').innerText=card.french;document.getElementById('card-roman').innerText=card.phonetic||'';document.getElementById('card-english').innerText=card.english;document.getElementById('card-category').innerText=card.category;document.getElementById('card-index').innerText=(currentIndex+1)+" / "+pool.length;document.getElementById('mastered-count').innerText=mastered.size+" / "+getActiveDataset().length;document.getElementById('progress-bar').style.width=((currentIndex+1)/pool.length*100)+"%";}
function switchMode(){currentMode=document.getElementById('mode-select').value;currentIndex=0;renderCard();}
function changeCategory(){currentIndex=0;renderCard();}
function handleSearch(){searchQuery=document.getElementById('search-input').value.trim();currentIndex=0;renderCard();}
function toggleFilterMastered(){hideMastered=!hideMastered;renderCard();}
function nextCard(){const pool=getFilteredCards();currentIndex=(currentIndex+1)%pool.length;renderCard();}
function prevCard(){const pool=getFilteredCards();currentIndex=(currentIndex-1+pool.length)%pool.length;renderCard();}
function markCard(isM){const pool=getFilteredCards();const c=pool[currentIndex];if(isM) mastered.add(c.id);else mastered.delete(c.id);localStorage.setItem('french_mastered_ids',JSON.stringify([...mastered]));nextCard();}
function playGoogleOnline(text, lang, onEnd){const url="https://translate.google.com/translate_tts?ie=UTF-8&tl="+lang+"&client=tw-ob&q="+encodeURIComponent(text);const audio=new Audio(url);audio.play().catch(()=>{if(onEnd) onEnd();});audio.onended=()=>{if(onEnd) onEnd();};}
function speakFrench(e){if(e) e.stopPropagation(); speakBoth(true);}
function speakEnglish(e){if(e) e.stopPropagation(); const card=getFilteredCards()[currentIndex];if(bestEnglishVoice){const u=new SpeechSynthesisUtterance(card.english);u.lang='en-US';u.voice=bestEnglishVoice;window.speechSynthesis.speak(u);}else playGoogleOnline(card.english,'en',null);}
function speakBoth(frenchOnly){const card=getFilteredCards()[currentIndex];const rate=document.getElementById('speech-rate').value||"0.9";const wantEn=document.getElementById('auto-en').checked;window.speechSynthesis.cancel();if(bestFrenchVoice){const uFr=new SpeechSynthesisUtterance(card.french);uFr.lang='fr-FR';uFr.voice=bestFrenchVoice;uFr.rate=parseFloat(rate);uFr.onend=()=>{if(wantEn&&!frenchOnly){const uEn=new SpeechSynthesisUtterance(card.english);uEn.lang='en-US';if(bestEnglishVoice) uEn.voice=bestEnglishVoice;window.speechSynthesis.speak(uEn);}};uFr.onerror=()=>{playGoogleOnline(card.french,'fr',()=>{if(wantEn&&!frenchOnly) playGoogleOnline(card.english,'en',null);});};window.speechSynthesis.speak(uFr);}else{playGoogleOnline(card.french,'fr',()=>{if(wantEn&&!frenchOnly) playGoogleOnline(card.english,'en',null);});}}
document.addEventListener('click',()=>{new Audio().play().catch(()=>{});},{once:true});
renderCard();
</script>
